<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f6f8;
        }

        .container {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #1976d2;
            color: white;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #1565c0;
        }

        .back {
            background: #777;
            margin-top: 10px;
        }

        .back:hover {
            background: #666;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e5f7e5;
            color: #146b14;
        }

    </style>

    <link rel="stylesheet" href="assets/css/navigation.css?v=20260913-nav">
    <link rel="stylesheet" href="assets/css/style.css?v=20260913-ec-navigation">
</head>


<body>


<div class="container">

    <nav class="page-navigation" aria-label="Page navigation">
        <button id="backBtn" type="button" class="back back-dashboard-button">
            Back to Dashboard
        </button>
    </nav>

    <h1>Change Password</h1>

    <p class="description">
        Update your account password.
        Use a strong password that you can remember.
    </p>


    <input
        type="password"
        id="newPassword"
        placeholder="New Password"
    >


    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm New Password"
    >


    <button id="changePasswordBtn">
        Change Password
    </button>
    <div id="message" class="message"></div>

</div>


<script type="module">

    // This legacy page had its own weaker password flow and did not
    // consistently enforce account status. Profile is the single active
    // password-management route and verifies an active system account.
    window.location.replace("profile.html");

    // Firebase imports

    import { initializeApp } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged,
        updatePassword
    } from
        "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    // Firebase configuration

   const firebaseConfig = {
  apiKey: "AIzaSyDdYImwHeNlLbfJ-S1N4Tv3kDbaOtZVd9s",
  authDomain: "voteguard-a6de3.firebaseapp.com",
  projectId: "voteguard-a6de3",
  storageBucket: "voteguard-a6de3.firebasestorage.app",
  messagingSenderId: "97235064913",
  appId: "1:97235064913:web:df10c7faf8149d53b88070"
};


    // Initialize Firebase

    const app =
        initializeApp(firebaseConfig);

    const auth =
        getAuth(app);


    // Get HTML elements

    const newPassword =
        document.getElementById("newPassword");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const changePasswordBtn =
        document.getElementById("changePasswordBtn");

    const backBtn =
        document.getElementById("backBtn");

    const message =
        document.getElementById("message");


    // -----------------------------
    // CHECK LOGIN
    // -----------------------------

    onAuthStateChanged(auth, (user) => {

        if (!user) {

            window.location.href =
                "login.html";

        }

    });


    // -----------------------------
    // CHANGE PASSWORD
    // -----------------------------

    changePasswordBtn.addEventListener("click", async () => {

        const password =
            newPassword.value;

        const confirm =
            confirmPassword.value;


        // Check empty fields

        if (!password || !confirm) {

            showMessage(
                "Please fill in both password fields.",
                "error"
            );

            return;

        }


        // Check password length

        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        // Check matching passwords

        if (password !== confirm) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        try {

            const user = auth.currentUser;


            if (!user) {

                showMessage(
                    "You are not signed in. Please login again.",
                    "error"
                );

                return;

            }


            // Update Firebase password

            await updatePassword(
                user,
                password
            );


            showMessage(
                "Password changed successfully.",
                "success"
            );


            // Clear fields

            newPassword.value = "";
            confirmPassword.value = "";


        } catch (error) {

            console.error(error);


            if (
                error.code ===
                "auth/requires-recent-login"
            ) {

                showMessage(
                    "For security, please sign in again before changing your password.",
                    "error"
                );

            } else {

                showMessage(
                    "Unable to change password. Please try again.",
                    "error"
                );

            }

        }

    });


    // -----------------------------
    // BACK BUTTON
    // -----------------------------

    backBtn.addEventListener("click", () => {

        window.history.back();

    });


    // -----------------------------
    // MESSAGE FUNCTION
    // -----------------------------

    function showMessage(text, type) {

        message.textContent = text;

        message.className =
            "message " + type;

        message.style.display =
            "block";

    }

</script>


</body>

</html>
